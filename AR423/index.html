<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A-Frame Sensor Camera Control</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            width: 280px;
            pointer-events: auto;
        }

        .section { margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .section:last-child { border-bottom: none; }
        h4 { margin: 0 0 10px 0; font-size: 14px; color: #aaa; }

        .btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        button {
            flex: 1;
            padding: 8px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #444;
            color: white;
            transition: background 0.2s;
        }
        button:active { background: #666; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        #btn-start { background: #28a745; }
        #btn-stop { background: #dc3545; }
        #btn-permission { background: #007bff; }
        #btn-reset { background: #6c757d; }

        .status { font-size: 12px; margin-top: 5px; }
        .status.success { color: #28a745; }
        .status.error { color: #ffc107; }

        #angle-display {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 3px;
        }

        #api-support { font-size: 10px; color: #888; margin-top: 5px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="section">
            <h4>1. Select Sensor</h4>
            <div class="btn-group">
                <button id="btn-gyro">Gyroscope</button>
                <button id="btn-orientation">Orientation</button>
            </div>
            <button id="btn-permission" style="width: 100%;">Request iOS Permission</button>
        </div>

        <div class="section">
            <h4>2. Control</h4>
            <div class="btn-group">
                <button id="btn-start" disabled>START</button>
                <button id="btn-stop" disabled>STOP</button>
            </div>
            <button id="btn-reset" style="width: 100%;">Reset Camera</button>
            <div id="sensor-status" class="status">Please select a sensor</div>
        </div>

        <div class="section">
            <div id="angle-display">
                <div style="font-size:10px;margin-bottom:3px">Current Angle:</div>
                X: 0.00° | Y: 0.00° | Z: 0.00°
            </div>
            <div id="api-support"></div>
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-assets>
            <img id="grid" src="https://img.gs/bbqphvxmtt/512x512,stretch/https://i.imgur.com/mYmmbrp.png">
        </a-assets>

        <a-sky color="#ECECEC"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" src="#grid" repeat="100 100"></a-plane>
        
        <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
        <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
        <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>

        <a-entity id="sensor-camera" camera look-controls="enabled: false" position="0 1.6 3"></a-entity>
    </a-scene>

    <script type="module">
  // スマホの画面に強制的にエラーを出すための仕組み
  window.onerror = function(msg, url, line) {
    alert("❌ Error: " + msg + "\nLine: " + line + "\nURL: " + url);
  };

  logToScreen("HTML script tag started...");

  function logToScreen(msg) {
    const div = document.createElement('div');
    div.style = "position:fixed;top:0;left:0;background:red;color:white;z-index:10002;font-size:12px;padding:5px;";
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000); // 3秒で消える
  }

  // main.js をインポートして実行
  import('./main.js').catch(err => {
    alert("❌ Import failed: " + err.message);
  });
</script>
</body>
</html>
