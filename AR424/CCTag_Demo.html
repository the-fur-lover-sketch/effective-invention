<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CCTag AR Demo (minimal)</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      #ui-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        background: rgba(220, 197, 197, 0.4);
        color: white;
        padding: 10px;
        font-family: sans-serif;
        pointer-events: none;
      }
      
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <div>Status: <span id="status">Initializing.....</span></div>
      <div>Markers: <span id="marker-count">0</span></div>
    </div>

    <a-scene>
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

      <a-entity id="rig">
        <a-camera id="main camera" position="0 1.5 3"></a-camera>
      </a-entity>
    </a-scene>
    <script src="js/renderer.js"></script>
  </body>
</html>
