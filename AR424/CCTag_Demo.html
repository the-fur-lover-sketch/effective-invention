<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CCTag AR Demo (minimal)</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      #ui-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        background: rgba(220, 197, 197, 0.4);
        color: white;
        padding: 10px;
        font-family: sans-serif;
        pointer-events: auto;
      }
      
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <div>Status: <span id="status">Initializing.....</span></div>
      <div>Markers: <span id="marker-count">0</span></div>
      <label>X (Pitch): <input type="range" id="debug-x" min="-180" max="180" value="0"></label><br>
      <label>Y (Yaw): <input type="range" id="debug-y" min="-180" max="180" value="0"></label><br>
      <label>Z (Roll): <input type="range" id="debug-z" min="-180" max="180" value="0"></label>

    </div>

    <a-scene>
      <a-plane position="0 0 0" rotation="0 0 0" width="20" height="10" color="#FF0000"></a-plane>

      <a-entity id="rig">
        <a-camera id="main-camera" look-controls="enabled: false" position="0 10 3"></a-camera>
      </a-entity>
    </a-scene>
    <script src="js/sensor-fusion.js"></script>
    <script src="js/renderer.js"></script>
  </body>
</html>
